# Run unit tests and package a release if all tests pass.
# https://github.com/lovette/outtamny/releases

name: Test and release Java JAR

on:
  # Allow triggering manually from GitHub UI.
  # Note: This apparently doesn't work for making releases because
  # the tag isn't available to the action.
  # workflow_dispatch:

  push:
    # Run workflow if commit is tagged with a semantic version number.
    # Applies to all branches.
    tags:
      - "v[0-9]+"
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Build and create release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') # Only runs when a version tag is pushed
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn --batch-mode package -DskipTests

      - name: Copy JAR to unversioned filename
        run: cp target/outtamny-[0-9]*.jar target/outtamny.jar

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --verbose --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            target/outtamny.jar
            target/outtamny-[0-9]*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
